pluginManagement { includeBuild("../node_modules/@react-native/gradle-plugin") }
plugins { id("com.facebook.react.settings") }
extensions.configure(com.facebook.react.ReactSettingsExtension){ ex ->
    /*
     * The default command is `npx @react-native-community/cli config`. npx
     * cannot run on this machine - the user profile path contains '&', which
     * breaks npm's generated .cmd shims - so call the CLI with node directly.
     * Autolinking output is cached, which is why this only surfaced on a clean.
     */
    ex.autolinkLibrariesFromCommand([
        "C:\\Program Files\\nodejs\\node.exe",
        "node_modules/@react-native-community/cli/build/bin.js",
        "config"
    ])
}
rootProject.name = 'TouchQueueMobile'
include ':app'

includeBuild('../node_modules/@react-native/gradle-plugin')